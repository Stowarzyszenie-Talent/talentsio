x-common-envs: &common-envs
 FILETRACKER_URL: 'http://web:9999'
 DATABASE_HOST: 'db'
 DATABASE_PORT: '5432'

services:
  db:
    image: library/postgres:15.1
    env_file: env
    volumes:
      - postgress-data-dev:/var/lib/postgresql/data
    stop_grace_period: 1m
  web:
    image: talentsio-dev
    command: ["/sio2/oioioi/oioioi_init.sh", "--dev"]
    env_file: env
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        - "oioioi_uid=${OIOIOI_UID}"
      extra_hosts:
        - "web:127.0.0.1"
    environment:
      # TODO: needed?
      OIOIOI_DB_ENGINE: 'django.db.backends.postgresql'
      RABBITMQ_HOST: 'broker'
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: 'oioioi'
      RABBITMQ_PASSWORD: 'oioioi'
      FILETRACKER_LISTEN_ADDR: '0.0.0.0'
      FILETRACKER_LISTEN_PORT: '9999'
      <<: *common-envs
    ports:
    # web server
      - "8000:8000"
    # notifications server
      - "7887:7887"
    volumes:
      - ./basic_settings_dev.py:/sio2/deployment/basic_settings.py
      - .:/sio2/oioioi
      # use docker's node_modules and dist_webpack instead of the host ones
      - node_modules-dev:/sio2/oioioi/node_modules
      - dist_webpack-dev:/sio2/oioioi/dist_webpack
      - filetracker-data-dev:/sio2/deployment/media
#      - ./deployment:/sio2/deployment
    stop_grace_period: 3m
    security_opt:
      - seccomp:./extra/docker/seccomp.json
      - apparmor:unconfined
    cap_add:
      - ALL
    depends_on:
      - db
      - broker
  worker:
    image: talentsio-dev
    command: ["/sio2/oioioi/worker_init.sh"]
    environment:
      WEB_URL: "web:8000"
      <<: *common-envs
    # TODO: why???????
    volumes:
      - .:/sio2/oioioi
    stop_grace_period: 1m
    security_opt:
      - seccomp:./extra/docker/seccomp.json
      - apparmor:unconfined
    cap_add:
      - ALL
    depends_on:
      - db
  broker:
    image: library/rabbitmq:3.8
    volumes:
      - ./extra/docker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    environment:
      RABBITMQ_LOGS:
      RABBITMQ_SASL_LOGS:
    stop_grace_period: 1m
volumes:
  postgress-data-dev:
  filetracker-data-dev:
  node_modules-dev:
  dist_webpack-dev:
